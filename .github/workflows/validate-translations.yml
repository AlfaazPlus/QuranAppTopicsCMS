name: Validate translations

on:
  pull_request:
    paths:
      - "translations/**"
      - "shared/**"
      - "scripts/**"
      - "web/public/topics.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validates against web/public/topics.json, the committed snapshot of topics.db.
      - name: Validate translation files
        id: validate
        run: node --no-warnings scripts/validate.mjs --summary summary.md
        continue-on-error: true

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('summary.md') ? fs.readFileSync('summary.md', 'utf8') : 'No summary.';
            const marker = '<!-- translation-validation -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = { ...context.repo, body: marker + '\n' + body };
            if (existing) await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            else await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });

      - name: Job summary
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Fail on validation errors
        if: steps.validate.outcome == 'failure'
        run: exit 1
